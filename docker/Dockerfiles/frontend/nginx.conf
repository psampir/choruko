### NGINX CORE CONFIGURATION
events {
    worker_connections 1024;  # Maximum number of simultaneous connections per worker
}

http {
    include       /etc/nginx/mime.types;  # Import MIME type mappings
    default_type  application/octet-stream;  # Default MIME type if not specified

    ### SERVER CONFIGURATION
    server {
        listen 80;  # Listen on port 80 (HTTP)
        server_name localhost;  # Server domain name
        root /usr/share/nginx/html;  # Document root directory
        index index.html;  # Default index file

        ### PERFORMANCE OPTIMIZATIONS
        # Enable gzip compression for faster content delivery
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ### API PROXY CONFIGURATION
        # Forward API requests to ASP.NET Core backend service
        location /api/ {
            # Route requests with /api/ prefix to backend service
            proxy_pass http://backend:8080;
            
            # Use HTTP/1.1 protocol for improved performance
            proxy_http_version 1.1;
            
            # Optimize connection handling for REST APIs
            proxy_set_header Connection "";
            
            # Pass original request headers to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            ### AUTHENTICATION CONFIGURATION
            # Cookie handling for ASP.NET Core Identity authentication
            proxy_set_header Cookie $http_cookie;  # Forward client cookies to backend
            proxy_cookie_path / /;  # Preserve cookie paths between services
        }

        ### FRONTEND ASSET HANDLING
        # Serve single-page application and static assets
        location / {
            try_files $uri $uri/ /index.html;  # SPA routing fallback
            
            # Optimize caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;  # Set long expiry time
                add_header Cache-Control "public, immutable";  # Aggressive caching
            }
        }

        ### PWA SUPPORT
        # Service worker requires special cache handling
        location /sw.js {
            add_header Cache-Control "no-cache";  # Prevent caching
            proxy_cache_bypass $http_pragma;
            proxy_cache_revalidate on;
            expires off;
            access_log off;
        }

        # PWA manifest file
        location /manifest.json {
            add_header Cache-Control "no-cache";  # Ensure latest version is served
        }

        ### SECURITY CONFIGURATION
        # Defensive security headers
        add_header X-Frame-Options "SAMEORIGIN" always;  # Prevent clickjacking
        add_header X-XSS-Protection "1; mode=block" always;  # Cross-site scripting protection
        add_header X-Content-Type-Options "nosniff" always;  # Prevent MIME type sniffing
        add_header Referrer-Policy "no-referrer-when-downgrade" always;  # Control referrer information

        # Content Security Policy for frontend-backend communication
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' http://backend:8080;" always;
    }
}