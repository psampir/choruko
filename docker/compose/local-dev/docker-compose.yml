services:
  db:
    image: postgres:15
    container_name: choruko_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: choruko
      POSTGRES_PASSWORD: choruko_pass
      POSTGRES_DB: choruko_dev
    ports:
      - "5432:5432"
    volumes:
      - pg/var/lib/postgresql/data

volumes:
  pg
