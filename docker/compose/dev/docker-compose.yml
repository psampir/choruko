name: choruko_dev

services:
  database:
    image: postgres:17.5-alpine3.22
    container_name: choruko_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: developer
      POSTGRES_DB: choruko_dev
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data

volumes:
  pg: