# Cleans up old container images from GitHub Container Registry.
name: Cleanup Old Container Images

permissions:
  packages: write

on:
  workflow_call:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:

      - name: Delete old choruko-frontend versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'choruko-frontend'
          package-type: 'container'
          min-versions-to-keep: 10

      - name: Delete old choruko-backend versions  
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'choruko-backend'
          package-type: 'container'
          min-versions-to-keep: 10

      - name: Delete old choruko-manager versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'choruko-manager'
          package-type: 'container'
          min-versions-to-keep: 10
