name: Deploy App

on:
  workflow_dispatch:
    inputs:
      frontend_image:
        description: 'Frontend image tag to deploy'
        type: string
        required: true
      backend_image:
        description: 'Backend image tag to deploy'
        type: string
        required: true
      manager_image:
        description: 'Manager image tag to deploy'
        type: string
        required: true
      environment:
        description: 'Environment to deploy to'
        type: string
        required: true
  workflow_call:
    inputs:
      frontend_image:
        description: 'Frontend image tag to deploy'
        type: string
        required: true
      backend_image:
        description: 'Backend image tag to deploy'
        type: string
        required: true
      manager_image:
        description: 'Manager image tag to deploy'
        type: string
        required: true
      environment:
        description: 'Environment to deploy to'
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Get input variables
        id: vars
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "FRONTEND_IMAGE=${{ inputs.frontend_image }}" >> $GITHUB_OUTPUT
            echo "BACKEND_IMAGE=${{ inputs.backend_image }}" >> $GITHUB_OUTPUT
            echo "MANAGER_IMAGE=${{ inputs.manager_image }}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "FRONTEND_IMAGE=${{ github.event.inputs.frontend_image }}" >> $GITHUB_OUTPUT
            echo "BACKEND_IMAGE=${{ github.event.inputs.backend_image }}" >> $GITHUB_OUTPUT
            echo "MANAGER_IMAGE=${{ github.event.inputs.manager_image }}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug server-ip-address and ssh-private-key
        run: |
          echo "Server IP: ${{ secrets.SERVER_IP_ADDRESS != '' && 'set' || 'empty' }}"
          echo "SSH Private Key: ${{ secrets.SSH_PRIVATE_KEY != '' && 'set' || 'empty' }}"

      - name: Set up SSH
        uses: ./.github/actions/ssh_setup
        with:
          server-ip-address: ${{ secrets.SERVER_IP_ADDRESS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        uses: ./.github/actions/ssh_execute
        with:
          command: "echo 'SSH connection successful!'"

      - name: Login to GitHub Container Registry
        uses: ./.github/actions/ssh_execute
        with:
          command: |
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # - name: Deploy application
      #   uses: ./.github/actions/ssh_file_send
      #   with:
      #     source: ./docker-compose.yml
      #     destination: /srv/docker-compose/choruko