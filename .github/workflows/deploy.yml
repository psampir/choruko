name: Deploy App

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        type: string
        required: true
      environment:
        description: 'Environment to deploy to'
        type: string
        required: true
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        type: string
        required: true
      environment:
        description: 'Environment to deploy to'
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Get input variables
        id: vars
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: ./.github/actions/ssh_setup
        with:
          server-ip-address: ${{ secrets.SERVER_IP_ADDRESS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        uses: ./.github/actions/ssh_execute
        with:
          command: "echo 'SSH connection successful!'"

      - name: Login to GitHub Container Registry
        uses: ./.github/actions/ssh_execute
        with:
          command: |
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Debug image tag
        run: |
          echo "Image tag: ${{ steps.vars.outputs.IMAGE_TAG }}"

      # - name: Deploy application
      #   uses: ./.github/actions/ssh_file_send
      #   with:
      #     source: ./docker-compose.yml
      #     destination: /srv/docker-compose/choruko