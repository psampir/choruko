name: Deploy App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: ./.github/actions/ssh_setup
        with:
          server-ip-address: ${{ secrets.SERVER_IP_ADDRESS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        uses: ./.github/actions/ssh_execute
        with:
          command: "echo 'SSH connection successful!'"

      - name: check cache
        run: |
          echo "Checking cache usage..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository_owner }}/choruko/actions/cache/usage" | \
            jq '{
              total_active_caches: .active_caches_count,
              active_cache_size_mb: (.active_caches_size_in_bytes / 1024 / 1024 | round),
              total_cache_entries: .total_count
            }'