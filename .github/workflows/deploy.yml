name: Deploy App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: ./.github/actions/ssh_setup
        with:
          server-ip-address: ${{ secrets.SERVER_IP_ADDRESS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        uses: ./.github/actions/ssh_execute
        with:
          command: "echo 'SSH connection successful!'"