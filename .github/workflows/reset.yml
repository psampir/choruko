# Resets the Choruko app to a clean state
name: Reset App

on:
  pull_request:
    branches:
      - actions_test
    paths:
      - .github/workflows/reset.yml
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to reset'
        type: string
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up SSH
        uses: ./.github/actions/ssh_setup
        with:
          server-ip-address: ${{ secrets.SERVER_IP_ADDRESS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Stop and remove existing containers with volumes
        uses: ./.github/actions/ssh_execute
        with:
          command: |
            cd /srv/docker-compose/choruko-${{ github.event.inputs.environment }}
            docker compose down -v

      - name: Create and start containers
        uses: ./.github/actions/ssh_execute
        with:
          command: |
            cd /srv/docker-compose/choruko-${{ github.event.inputs.environment }}
            docker compose up -d