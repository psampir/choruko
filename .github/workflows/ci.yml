name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/ChorukoAPI.sln

      - name: Build
        run: dotnet build backend/ChorukoAPI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/ChorukoAPI.sln --no-build --configuration Release --logger "console;verbosity=minimal"

  backend-alpine:
    name: Backend (Alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test on Alpine (musl)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            dotnet test backend/HouseholdService.Test/HouseholdService.Test.csproj --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/ChorukoWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/ChorukoWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
