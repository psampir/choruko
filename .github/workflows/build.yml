# Builds the Choruko application Docker images for frontend, backend, and manager.
name: Build App

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        type: string
        required: true
        default: 'dev'
      release_tag:
        description: 'Release tag for the build'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build from'
        type: string
        required: true
        default: 'dev'
      release_tag:
        description: 'Release tag for the build'
        type: string
        required: false
        default: ''

jobs:
  build:
    outputs:
      image_tag: ${{ steps.image_tag.outputs.IMAGE_TAG }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: choruko-frontend
            dockerfile: ./docker/Dockerfiles/frontend/Dockerfile
          - name: choruko-backend
            dockerfile: ./docker/Dockerfiles/backend/Dockerfile
          - name: choruko-manager
            dockerfile: ./docker/Dockerfiles/manager/Dockerfile
    steps:

      - name: Get input variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == 'workflow_dispatch' ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == 'workflow_call' ]; then
            echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "Unknown event type: ${GITHUB_EVENT_NAME}"
            exit 1
          fi

      - name: Fail if release tag not provided
        if: ${{ steps.vars.outputs.BRANCH == 'main' }}
        run: |
          if [ -z "${{ steps.vars.outputs.RELEASE_TAG }}" ]; then
            echo "Release tag is required for main branch."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Check if branch exists in the repository
        if: ${{ steps.vars.outputs.BRANCH != 'main' }}
        run: |
          if ! git show-ref --verify --quiet refs/heads/${{ steps.vars.outputs.BRANCH }}; then
            echo "Branch ${{ steps.vars.outputs.BRANCH }} does not exist in the repository."
            exit 1
          fi

      - name: Set Docker image tag for branch
        if: ${{ steps.vars.outputs.BRANCH != 'main' }}
        id: prefix
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M)
          echo "BRANCH_PREFIX=${{ steps.vars.outputs.BRANCH }}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} image (non-main branch)
        if: ${{ steps.vars.outputs.BRANCH != 'main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: |
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.prefix.outputs.BRANCH_PREFIX }}"
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache,mode=max

      - name: Build and push ${{ matrix.image.name }} image (main branch)
        if: ${{ steps.vars.outputs.BRANCH == 'main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: |
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest"
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.vars.outputs.RELEASE_TAG }}"
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache,mode=max
          
      - name: Return image tag
        id: image_tag
        run: |
          if [ "${{ steps.vars.outputs.BRANCH }}" == "main" ]; then
            echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.vars.outputs.RELEASE_TAG }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.prefix.outputs.BRANCH_PREFIX }}" >> $GITHUB_OUTPUT
          fi
