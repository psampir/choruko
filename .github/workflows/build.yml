# Builds the Choruko application Docker images for frontend, backend, and manager.
name: Build App

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build from'
        type: string
        required: true
        default: 'dev'
      release:
        description: 'Is this a release build?'
        type: boolean
        required: true
        default: false
      build_frontend:
        description: 'Build frontend image?'
        type: boolean
        required: false
        default: true
      build_backend:
        description: 'Build backend image?'
        type: boolean
        required: false
        default: true
      build_manager:
        description: 'Build manager image?'
        type: boolean
        required: false
        default: true
      previous_tag:
        description: 'Previous tag to use for skipped images (e.g., dev-202412021530, v1.0.0, or latest)'
        type: string
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build from'
        type: string
        required: true
        default: 'dev'
      release:
        description: 'Is this a release build?'
        type: boolean
        required: true
        default: false
      build_frontend:
        description: 'Build frontend image?'
        type: boolean
        required: false
        default: true
      build_backend:
        description: 'Build backend image?'
        type: boolean
        required: false
        default: true
      build_manager:
        description: 'Build manager image?'
        type: boolean
        required: false
        default: true
      previous_tag:
        description: 'Previous tag to use for skipped images'
        type: string
        required: false
        default: 'latest'
    outputs:
      frontend_image:
        description: 'Frontend image tag'
        value: ${{ jobs.summary.outputs.frontend_image }}
      backend_image:
        description: 'Backend image tag'
        value: ${{ jobs.summary.outputs.backend_image }}
      manager_image:
        description: 'Manager image tag'
        value: ${{ jobs.summary.outputs.manager_image }}

jobs:
  
  build:
    runs-on: ubuntu-latest
    outputs:
      frontend_tag: ${{ steps.image_tag.outputs.frontend_tag }}
      backend_tag: ${{ steps.image_tag.outputs.backend_tag }}
      manager_tag: ${{ steps.image_tag.outputs.manager_tag }}
    strategy:
      matrix:
        image:
          - name: choruko-frontend
            dockerfile: ./docker/Dockerfiles/frontend/Dockerfile
            build_input: build_frontend
          - name: choruko-backend
            dockerfile: ./docker/Dockerfiles/backend/Dockerfile
            build_input: build_backend
          - name: choruko-manager
            dockerfile: ./docker/Dockerfiles/manager/Dockerfile
            build_input: build_manager
    steps:

      - name: Get input variables
        id: vars
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_OUTPUT
            echo "RELEASE=${{ inputs.release }}" >> $GITHUB_OUTPUT
            echo "BUILD_FRONTEND=${{ inputs.build_frontend }}" >> $GITHUB_OUTPUT
            echo "BUILD_BACKEND=${{ inputs.build_backend }}" >> $GITHUB_OUTPUT
            echo "BUILD_MANAGER=${{ inputs.build_manager }}" >> $GITHUB_OUTPUT
            echo "PREVIOUS_TAG=${{ inputs.previous_tag }}" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
            echo "RELEASE=${{ github.event.inputs.release }}" >> $GITHUB_OUTPUT
            echo "BUILD_FRONTEND=${{ github.event.inputs.build_frontend }}" >> $GITHUB_OUTPUT
            echo "BUILD_BACKEND=${{ github.event.inputs.build_backend }}" >> $GITHUB_OUTPUT
            echo "BUILD_MANAGER=${{ github.event.inputs.build_manager }}" >> $GITHUB_OUTPUT
            echo "PREVIOUS_TAG=${{ github.event.inputs.previous_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine if this image should be built
        id: should_build
        run: |
          if [[ "${{ matrix.image.build_input }}" == "build_frontend" ]]; then
            echo "BUILD=${{ steps.vars.outputs.BUILD_FRONTEND }}" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image.build_input }}" == "build_backend" ]]; then
            echo "BUILD=${{ steps.vars.outputs.BUILD_BACKEND }}" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image.build_input }}" == "build_manager" ]]; then
            echo "BUILD=${{ steps.vars.outputs.BUILD_MANAGER }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: ${{ steps.should_build.outputs.BUILD == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.BRANCH }}
          lfs: true

      - name: Check if tag exists in the repository
        if: ${{ steps.should_build.outputs.BUILD == 'true' && steps.vars.outputs.RELEASE == 'true' }}
        run: |
          if ! git show-ref --verify --quiet refs/tags/${{ steps.vars.outputs.BRANCH }}; then
            echo "Tag ${{ steps.vars.outputs.BRANCH }} does not exist in the repository."
            exit 1
          fi

      - name: Check if branch exists in the repository
        if: ${{ steps.should_build.outputs.BUILD == 'true' && steps.vars.outputs.RELEASE == 'false' }}
        run: |
          if ! git show-ref --verify --quiet refs/heads/${{ steps.vars.outputs.BRANCH }}; then
            echo "Branch ${{ steps.vars.outputs.BRANCH }} does not exist in the repository."
            exit 1
          fi

      - name: Set Docker image tag for non-release builds
        if: ${{ steps.vars.outputs.RELEASE == 'false' }}
        id: prefix
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M)
          echo "BRANCH_PREFIX=${{ steps.vars.outputs.BRANCH }}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: ${{ steps.should_build.outputs.BUILD == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} image (non-release)
        if: ${{ steps.should_build.outputs.BUILD == 'true' && steps.vars.outputs.RELEASE == 'false' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: |
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest"
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.prefix.outputs.BRANCH_PREFIX }}"
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache,mode=max

      - name: Build and push ${{ matrix.image.name }} image (release)
        if: ${{ steps.should_build.outputs.BUILD == 'true' && steps.vars.outputs.RELEASE == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: |
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest"
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:release"
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.vars.outputs.BRANCH }}"
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache,mode=max
      
      - name: Pull and re-tag existing image for ${{ matrix.image.name }}
        if: ${{ steps.should_build.outputs.BUILD == 'false' }}
        run: |
          SOURCE_TAG="${{ steps.vars.outputs.PREVIOUS_TAG }}"
          if [ "${{ steps.vars.outputs.RELEASE }}" == "true" ]; then
            NEW_TAG="${{ steps.vars.outputs.BRANCH }}"
          else
            NEW_TAG="${{ steps.prefix.outputs.BRANCH_PREFIX }}"
          fi
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}"
          
          echo "Pulling ${IMAGE_NAME}:${SOURCE_TAG}"
          docker pull "${IMAGE_NAME}:${SOURCE_TAG}"
          
          echo "Re-tagging to ${IMAGE_NAME}:${NEW_TAG}"
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:${NEW_TAG}"
          
          echo "Pushing ${IMAGE_NAME}:${NEW_TAG}"
          docker push "${IMAGE_NAME}:${NEW_TAG}"
          
          echo "✅ Skipped building ${{ matrix.image.name }}, re-tagged from ${SOURCE_TAG} to ${NEW_TAG}"
      
      - name: Return image tag
        id: image_tag
        run: |
          if [ "${{ steps.vars.outputs.RELEASE }}" == "true" ]; then
            IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.vars.outputs.BRANCH }}"
          else
            IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.prefix.outputs.BRANCH_PREFIX }}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          
          # Set specific output variables based on which image is being built
          if [[ "${{ matrix.image.name }}" == "choruko-frontend" ]]; then
            echo "frontend_tag=${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
            echo "frontend_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image.name }}" == "choruko-backend" ]]; then
            echo "backend_tag=${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
            echo "backend_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image.name }}" == "choruko-manager" ]]; then
            echo "manager_tag=${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
            echo "manager_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          fi
  
  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${{ needs.build.outputs.frontend_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: ${{ needs.build.outputs.backend_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Manager**: ${{ needs.build.outputs.manager_tag }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Set outputs
        id: set_outputs
        run: |
          echo "frontend_image=${{ needs.build.outputs.frontend_tag }}" >> $GITHUB_OUTPUT
          echo "backend_image=${{ needs.build.outputs.backend_tag }}" >> $GITHUB_OUTPUT
          echo "manager_image=${{ needs.build.outputs.manager_tag }}" >> $GITHUB_OUTPUT
    outputs:
      frontend_image: ${{ steps.set_outputs.outputs.frontend_image }}
      backend_image: ${{ steps.set_outputs.outputs.backend_image }}
      manager_image: ${{ steps.set_outputs.outputs.manager_image }}