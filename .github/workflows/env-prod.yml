name: Prod Env Pipeline

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the build'
        type: string
        required: true
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      RELEASE_TAG: ${{ steps.vars.outputs.RELEASE_TAG }}
    steps:
      
      - name: Get input variables
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate release tag
        run: |
          # if RELEASE_TAG not set, fail the job
          if [ -z "${{ steps.vars.outputs.RELEASE_TAG }}" ]; then
            echo "RELEASE_TAG is not set. Please provide a valid release tag."
            exit 1
          fi
  
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ needs.prepare.outputs.RELEASE_TAG }}
      release: true
  
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      frontend_image: ${{ needs.build.outputs.frontend_image }}
      backend_image: ${{ needs.build.outputs.backend_image }}
      manager_image: ${{ needs.build.outputs.manager_image }}
      environment: prod
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP_ADDRESS: ${{ secrets.SERVER_IP_ADDRESS }}
      CR_PAT: ${{ secrets.CR_PAT }}
  
  ghcr_cleanup:
    needs: deploy
    uses: ./.github/workflows/ghcr-cleanup.yml