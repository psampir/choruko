name: Test Env Pipeline

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      branch: 48-add-app-deployment-pipeline
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      frontend_image: ${{ needs.build.outputs.frontend_image }}
      backend_image: ${{ needs.build.outputs.backend_image }}
      manager_image: ${{ needs.build.outputs.manager_image }}
      environment: test
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP_ADDRESS: ${{ secrets.SERVER_IP_ADDRESS }}
      CR_PAT: ${{ secrets.CR_PAT }}