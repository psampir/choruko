name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets (passwords, tokens, cookies,
        `.env` contents) from logs and screenshots before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Choruko version
      description: Release tag, image tag, or commit hash.
      placeholder: v1.0.2
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (provided compose file)
        - Docker Compose (custom)
        - Local development
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser, OS and reverse proxy
      placeholder: Chrome 140 on Android 16, Caddy with HTTPS
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs`, browser console, or stack traces.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed secrets from logs and screenshots.
          required: true
